# Fly.io configuration for TausePro
# Optimized for Colombia deployment

app = "tausepro"
primary_region = "bog"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  COLOMBIA_MODE = "true"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "1s"
    restart_limit = 0

  [services.http_options]
    compress = true

[metrics]
  port = 9091
  path = "/metrics"

[deploy]
  strategy = "rolling"
  max_unavailable = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024 